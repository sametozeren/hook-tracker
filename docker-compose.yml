name: hook-tracker

# The dependency set every application process shares. An anchor rather than
# four copies: a service that stopped waiting for `migrate` would start against
# an unmigrated schema, and that is a difference too easy to introduce by
# editing one stanza and not the other.
x-backend-depends-on: &backend-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # One-shot. No application process ever runs a migration itself, so concurrent
  # workers cannot race on the schema.
  migrate:
    build:
      context: ./backend
    command: ['npm', 'run', 'migrate:deploy']
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./backend
    command: ['node', 'src/api/server.js']
    env_file:
      - .env
    ports:
      - '${PORT:-3000}:3000'
    depends_on: *backend-depends-on
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ['node', 'src/worker/worker.js']
    env_file:
      - .env
    depends_on: *backend-depends-on
    deploy:
      replicas: 1
    restart: unless-stopped

  # Demo target for the bundled seed data. No host port: the stack only reaches
  # it over the Docker network, which is also what SSRF_ALLOWLIST_HOSTS permits.
  receiver:
    build:
      context: ./backend
    command: ['node', 'src/demo-receiver/server.js']
    env_file:
      - .env
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
